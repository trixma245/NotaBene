<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="NotaBene enregistre tes cours, les transcrit et en fait des fiches de révision.">
<title>NotaBene</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-bar" hidden>Hors ligne — tu peux enregistrer, la transcription attendra le réseau.</div>
<main id="view" tabindex="-1"></main>

<nav id="nav" aria-label="Navigation principale">
  <a href="#/" data-nav="home"><span class="ico">🏠</span><span>Accueil</span></a>
  <a href="#/subjects" data-nav="subjects"><span class="ico">📚</span><span>Matières</span></a>
  <a href="#/search" data-nav="search"><span class="ico">🔎</span><span>Recherche</span></a>
  <a href="#/review" data-nav="review"><span class="ico">🧠</span><span>Réviser</span><b id="due-badge" hidden></b></a>
  <a href="#/settings" data-nav="settings"><span class="ico">⚙️</span><span>Réglages</span></a>
</nav>

<div id="toasts" aria-live="polite"></div>

<!-- Mode écran noir : tout l'écran est noir pour économiser la batterie pendant l'enregistrement -->
<div id="blackout" hidden>
  <p id="blackout-hint">Enregistrement en cours<br><small>Touche deux fois l'écran pour revenir</small></p>
</div>

<!-- Zone utilisée uniquement pour l'impression / PDF de la fiche -->
<div id="print"></div>

<noscript><p style="padding:2rem;color:#fff">NotaBene a besoin de JavaScript pour fonctionner.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
